<html>
    <body>
        <P>
            use html to assign an "onkeypress" event to en input element</P>
         <P>press a key inside the text field to set  red background color.
            
        </P>
        <input type ="text" id="demo">
        <script>
            document.getElementById("demo").onkeypress= myfunction
        function myfunction(){
            document.getElementById("demo")
        }
        
        
        </script>
    </body>

</html>
