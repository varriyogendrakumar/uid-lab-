<!DOCTYPE html>
<html>
<head>
    <title>Sort 3 Numbers</title>
    <style>
        body {
            font-family: Arial;
            background-color: #eef;
            text-align: center;
            margin-top: 100px;
        }

        .box {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Sort 3 Numbers</h2>

        <input type="number" id="num1" placeholder="Enter first number"><br>
        <input type="number" id="num2" placeholder="Enter second number"><br>
        <input type="number" id="num3" placeholder="Enter third number"><br>

        <button onclick="sortNumbers()">Sort</button>
    </div>

    <script>
        function sortNumbers() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            let c = Number(document.getElementById("num3").value);

            let result;

            // Conditional logic to sort numbers in ascending order
            if (a <= b && a <= c) {
                if (b <= c) {
                    result = a + ", " + b + ", " + c;
                } else {
                    result = a + ", " + c + ", " + b;
                }
            } 
            else if (b <= a && b <= c) {
                if (a <= c) {
                    result = b + ", " + a + ", " + c;
                } else {
                    result = b + ", " + c + ", " + a;
                }
            } 
            else {
                if (a <= b) {
                    result = c + ", " + a + ", " + b;
                } else {
                    result = c + ", " + b + ", " + a;
                }
            }

            alert("Sorted numbers (Ascending): " + result);
        }
    </script>

</body>
</html>
