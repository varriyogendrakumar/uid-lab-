<!DOCTYPE html>
<html>
<head>
    <title>Sign of Product</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }

        .box {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Find Sign of Product</h2>

        <input type="number" id="num1" placeholder="Enter first number"><br>
        <input type="number" id="num2" placeholder="Enter second number"><br>
        <input type="number" id="num3" placeholder="Enter third number"><br>

        <button onclick="findSign()">Check Sign</button>
    </div>

    <script>
        function findSign() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            let c = Number(document.getElementById("num3").value);

            let product = a * b * c;

            if (product > 0) {
                alert("The sign is + (Positive)");
            } 
            else if (product < 0) {
                alert("The sign is - (Negative)");
            } 
            else {
                alert("The sign is 0 (Zero)");
            }
        }
    </script>

</body>
</html>
